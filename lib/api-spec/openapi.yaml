openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form operations
  - name: newsletter
    description: Newsletter signup operations
  - name: sermons
    description: Sermon archive reads
  - name: news
    description: News note reads
  - name: gallery
    description: Gallery reads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a contact message
      description: Stores a message sent from the public contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMessage"
        "400":
          description: Invalid input
  /sermons:
    get:
      operationId: listSermons
      tags: [sermons]
      summary: List sermons
      description: All sermons, newest first
      responses:
        "200":
          description: Sermon list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SermonDto"
  /sermons/{slug}:
    get:
      operationId: getSermon
      tags: [sermons]
      summary: Get one sermon
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The sermon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SermonDto"
        "404":
          description: Not found
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news notes
      description: All news notes, newest first
      responses:
        "200":
          description: News list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsPostDto"
  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List gallery items
      responses:
        "200":
          description: Gallery list, in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryItemDto"
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email to the newsletter
      description: Stores a newsletter signup; resubscribing an existing email is a no-op
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSignupInput"
      responses:
        "201":
          description: Subscribed (or already subscribed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSignup"
        "400":
          description: Invalid input
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactMessageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 200
        topic:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 5000
      required:
        - name
        - email
        - topic
        - message
    ContactMessage:
      allOf:
        - $ref: "#/components/schemas/ContactMessageInput"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - createdAt
    NewsletterSignupInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 200
      required:
        - email
    NewsletterSignup:
      allOf:
        - $ref: "#/components/schemas/NewsletterSignupInput"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - createdAt
    SermonDto:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        speaker:
          type: string
        date:
          type: string
        iso:
          type: string
        tag:
          type: string
        scripture:
          type: string
        summary:
          type: array
          items:
            type: string
        artworkUrl:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
      required:
        - id
        - slug
        - title
        - speaker
        - date
        - iso
        - tag
        - scripture
        - summary
        - artworkUrl
        - audioUrl
    NewsPostDto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        date:
          type: string
        iso:
          type: string
        tag:
          type: string
        body:
          type: string
        full:
          type: string
        artworkUrl:
          type: string
          nullable: true
      required:
        - id
        - title
        - date
        - iso
        - tag
        - body
        - full
        - artworkUrl
    GalleryItemDto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
        desc:
          type: string
        imageUrl:
          type: string
        position:
          type: integer
      required:
        - id
        - title
        - type
        - desc
        - imageUrl
        - position
